<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#140b33" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />

    <!-- Defaults for crawlers and link previews that don't run JavaScript. Pages override these at runtime. -->
    <title>Buy Diwali Crackers Online: Up to 70% OFF</title>
    <meta
      name="description"
      content="Buy Diwali crackers online from Sivakasi at up to 70% off. Sky shots, sparklers, anar, chakkar, green crackers and combo packs with home delivery."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Buy Diwali Crackers Online: Up to 70% OFF" />
    <meta property="og:description" content="Genuine Sivakasi crackers, combo packs and green crackers delivered to your doorstep." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Yatra+One&display=swap" rel="stylesheet" />

    <!-- Boot loader styles are inline so the loader paints before the JS/CSS bundles arrive.
         StoreProvider renders the same markup while the catalogue loads, so there is no jump. -->
    <style>
      html, body { margin: 0; background: #0b0620; }
      .boot {
        position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; color: #f6f1ff; font-family: "Outfit", ui-sans-serif, system-ui, sans-serif;
        background:
          radial-gradient(600px 320px at 50% 42%, rgba(255, 160, 60, 0.22), transparent 70%),
          linear-gradient(160deg, #140b33 0%, #1e1147 45%, #3a0a1f 100%);
      }
      .boot-diya { position: relative; font-size: 64px; line-height: 1; animation: boot-float 2.4s ease-in-out infinite; }
      .boot-diya::before {
        content: ""; position: absolute; left: 50%; top: 2px; width: 70px; height: 70px; transform: translate(-50%, -30%);
        border-radius: 50%; background: radial-gradient(circle, rgba(255, 200, 90, 0.55), transparent 65%);
        animation: boot-glow 1.1s ease-in-out infinite alternate; z-index: -1;
      }
      .boot-title {
        margin: 0; font-family: "Yatra One", "Outfit", serif; font-size: 22px; letter-spacing: 0.02em;
        background: linear-gradient(90deg, #ffe199, #ffa24c 50%, #ffd166); -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .boot-bar { position: relative; width: min(240px, 64vw); height: 4px; overflow: hidden; border-radius: 999px; background: rgba(255, 255, 255, 0.12); }
      .boot-bar::after {
        content: ""; position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: inherit;
        background: linear-gradient(90deg, transparent, #ffd166, #ff8c42, transparent);
        box-shadow: 0 0 12px rgba(255, 170, 60, 0.8); animation: boot-slide 1.15s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      .boot-text { margin: 0; font-size: 13px; color: rgba(255, 255, 255, 0.6); }
      @keyframes boot-slide { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
      @keyframes boot-glow { from { opacity: 0.55; transform: translate(-50%, -30%) scale(0.92); } to { opacity: 1; transform: translate(-50%, -30%) scale(1.08); } }
      @keyframes boot-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @media (prefers-reduced-motion: reduce) {
        .boot-diya, .boot-diya::before { animation: none; }
        .boot-bar::after { animation-duration: 2.4s; }
      }
    </style>
  </head>
  <body class="font-sans antialiased">
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <div class="boot-diya" aria-hidden="true">🪔</div>
        <p class="boot-title">Lighting up the Diwali sale</p>
        <div class="boot-bar" aria-hidden="true"></div>
        <p class="boot-text">Loading crackers &amp; offers…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
